# Perfil de teste - H2 em memória
spring.profiles.active=test

# H2 Database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Circuit Breaker - Configuração para testes rápidos
resilience4j.circuitbreaker.instances.atualizarPedido.slidingWindowSize=3
resilience4j.circuitbreaker.instances.atualizarPedido.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.atualizarPedido.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.atualizarPedido.failureRateThreshold=50
resilience4j.circuitbreaker.instances.atualizarPedido.waitDurationInOpenState=1s
resilience4j.circuitbreaker.instances.atualizarPedido.permittedNumberOfCallsInHalfOpenState=2

# Error handling
server.error.include-message=always
server.error.include-stacktrace=always

# Logging para debug de circuit breaker
logging.level.io.github.resilience4j=DEBUG
logging.level.br.com.fiap.ms_pagamentos=DEBUG